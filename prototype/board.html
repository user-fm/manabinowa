<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>まなびのわ - 教育委員会用ホーム</title>
<link rel="icon" href="img/logo_32.png">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/board.css">
</head>
<body>

<div class="header" id="header"></div>

<div class="container">
  <div class="crumbs">ホーム</div>
  <h2>教育委員会用ホーム</h2>
  <p class="lead">集計されたデータのみ閲覧できます。個別の事案の内容は、各学校の管理者までの権限です。</p>

  <div class="stat-grid">
    <div class="stat">
      <div class="num">1</div>
      <div class="label">利用校数</div>
    </div>
    <div class="stat">
      <div class="num" id="statSessions">0</div>
      <div class="label">今月の指導セッション</div>
    </div>
    <div class="stat">
      <div class="num" id="statAlerts">0</div>
      <div class="label">AIアラート件数<br><span id="alertNote"></span></div>
    </div>
    <div class="stat">
      <div class="num" id="statMatch">—</div>
      <div class="label">マッチング成立率</div>
    </div>
  </div>

  <button class="btn" onclick="printReport()">月次レポートを出力</button>
  <p class="hint">月次レポートには、利用状況とアラート対応の記録がまとまります。</p>
</div>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/board.js"></script>
</body>
</html>
