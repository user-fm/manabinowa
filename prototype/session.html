<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>まなびのわ - オンライン指導</title>
<link rel="icon" href="img/logo_32.png">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/session.css">
</head>
<body>

<div class="header" id="header"></div>

<div class="container">
  <div class="crumbs"><a href="#" onclick="goHome();return false">ホーム</a> ＞ オンライン指導</div>
  <button class="back" onclick="goHome()">← もどる</button>
  <h2>オンライン指導セッション</h2>
  <div class="session-area">
    <div class="meet-box">
      <p>Google Meet の画面（モック）</p>
      <div class="members">
        <span>田中先生</span><span>太郎さん</span><span id="volMember">山本さん</span>
      </div>
      <div class="pause-cover" id="pauseCover">
        セッションを一時停止しています<br>
        <small>学校の先生・管理者が内容を確認しています</small>
      </div>
    </div>
    <div class="chat-box">
      <div class="chat-title">チャット</div>
      <div class="chat-log" id="chatLog">
        <div class="msg system">チャットの内容はAIが自動でチェックしています</div>
      </div>
      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="メッセージを入力" onkeydown="if(event.key==='Enter')sendChat()">
        <button class="btn btn-small" onclick="sendChat()">送信</button>
      </div>
    </div>
  </div>

  <div class="wb-box">
    <div class="wb-head">
      <span class="wb-title">ホワイトボード</span>
      <span class="wb-tools">
        <button data-color="#333333" class="on" onclick="setPen(this)">黒</button>
        <button data-color="#c0392b" onclick="setPen(this)">赤</button>
        <button data-color="#2a6fbb" onclick="setPen(this)">青</button>
        <button onclick="clearBoard()">全部消す</button>
      </span>
    </div>
    <canvas id="wb" height="240"></canvas>
    <p class="hint">問題や図をここに書いて説明できます。書いた内容は参加者全員に共有される想定です。</p>
  </div>

  <p class="hint">デモ：「連絡先」「住所」などの言葉を含むメッセージを送るとAI検知の動きが、「会おう」などを送ると一時停止までの動きが確認できます。</p>
  <button class="btn btn-gray" onclick="endSession()">セッションを終了</button>
</div>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/session.js"></script>
</body>
</html>
